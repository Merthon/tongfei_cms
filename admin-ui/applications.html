<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>应用场景管理 - TONFY CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .img-preview { max-height: 120px; object-fit: contain; background: #000; border-radius: 4px; padding: 5px; margin-top: 10px;}
        .card-header { font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex" style="min-height: 100vh">
        <div id="sidebar-container" class="bg-dark" style="width: 250px; flex-shrink: 0"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="header-container"></div>
            
            <div class="container-fluid p-4">
                <h3 class="mb-4">🌍 应用场景模块管理</h3>
                <div id="app-list" class="row">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./common.js"></script>

    <script>
        initLayout('applications'); // 设置菜单高亮 (记得在 common.js 里加一下这个菜单哦！)
        const token = localStorage.getItem('cms_token');
        const headers = { 'Authorization': 'Bearer ' + token };

        // 加载数据
        async function loadApps() {
            try {
                const res = await fetch('/api/admin/applications', { headers });
                const data = await res.json();
                
                let html = '';
                data.forEach(app => {
                    html += `
                    <div class="col-12 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                                <span>${app.order}. ${app.title} (标识: ${app.anchor})</span>
                                <button class="btn btn-sm btn-light fw-bold" onclick="saveApp(${app.id})">💾 保存此板块</button>
                            </div>
                            <div class="card-body row">
                                <div class="col-md-7">
                                    <div class="mb-2">
                                        <label class="text-muted small">顶部副标题 (Top)</label>
                                        <input type="text" class="form-control form-control-sm" id="top_${app.id}" value="${app.top}">
                                    </div>
                                    <div class="mb-2">
                                        <label class="text-muted small">主标题 (Title)</label>
                                        <input type="text" class="form-control form-control-sm" id="title_${app.id}" value="${app.title}">
                                    </div>
                                    <div class="mb-2">
                                        <label class="text-muted small">描述文案 (Subtitle，支持 &lt;br&gt; 换行)</label>
                                        <textarea class="form-control form-control-sm" id="subtitle_${app.id}" rows="3">${app.subtitle}</textarea>
                                    </div>
                                    <div class="mb-2">
                                        <label class="text-muted small">了解更多链接 (Link)</label>
                                        <input type="text" class="form-control form-control-sm" id="link_${app.id}" value="${app.link}">
                                    </div>
                                </div>
                                
                                <div class="col-md-5">
                                    <div class="mb-3">
                                        <label class="text-muted small d-block">背景大图 (Background)</label>
                                        <input type="file" class="form-control form-control-sm mb-2" onchange="uploadImg(this, 'bg_${app.id}')">
                                        <input type="hidden" id="bg_${app.id}" value="${app.background}">
                                        <img src="${app.background}" id="bg_preview_${app.id}" class="img-preview" onerror="this.style.display='none'">
                                    </div>
                                    <div class="mb-3">
                                        <label class="text-muted small d-block">侧边配图 (Image)</label>
                                        <input type="file" class="form-control form-control-sm mb-2" onchange="uploadImg(this, 'img_${app.id}')">
                                        <input type="hidden" id="img_${app.id}" value="${app.image}">
                                        <img src="${app.image}" id="img_preview_${app.id}" class="img-preview bg-white border" onerror="this.style.display='none'">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
                document.getElementById('app-list').innerHTML = html;
            } catch (err) {
                console.error("加载失败", err);
            }
        }

        // 上传图片逻辑 (复用你现有的上传接口)
        async function uploadImg(inputElement, targetId) {
            const file = inputElement.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('file', file);
            
            try {
                const res = await fetch('/api/admin/upload', { method: 'POST', headers, body: fd });
                const result = await res.json();
                if (res.ok) {
                    document.getElementById(targetId).value = result.url;
                    document.getElementById(targetId + '_preview').src = result.url;
                    document.getElementById(targetId + '_preview').style.display = 'block';
                } else {
                    alert('上传失败: ' + result.error);
                }
            } catch (err) {
                alert('上传网络错误');
            }
        }

        // 独立保存单个板块
        async function saveApp(id) {
            const payload = {
                top: document.getElementById('top_' + id).value,
                title: document.getElementById('title_' + id).value,
                subtitle: document.getElementById('subtitle_' + id).value,
                link: document.getElementById('link_' + id).value,
                background: document.getElementById('bg_' + id).value,
                image: document.getElementById('img_' + id).value,
            };

            try {
                const res = await fetch('/api/admin/applications/' + id, {
                    method: 'PUT',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('✅ 该板块更新成功！前台已实时生效。');
                } else {
                    alert('保存失败，请检查网络');
                }
            } catch (err) {
                alert('保存发生错误');
            }
        }

        document.addEventListener('DOMContentLoaded', loadApps);
    </script>
</body>
</html>
