<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主页数据管理 - TONFY CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <div class="d-flex" style="min-height: 100vh">
        <div id="sidebar-container" class="bg-dark" style="width: 250px; flex-shrink: 0"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="header-container"></div>
            
            <div class="container-fluid p-4" style="max-width: 900px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>📊 主页数据配置</h3>
                    <button class="btn btn-primary btn-lg fw-bold" onclick="saveHomeConfig()">💾 保存最新数据</button>
                </div>

                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-primary text-white fw-bold">第一排：核心团队与设施数字</div>
                    <div class="card-body row g-3">
                        <div class="col-md-4">
                            <label class="form-label text-muted small">Total Employees (总员工数)</label>
                            <input type="number" id="emp_count" class="form-control form-control-lg text-primary fw-bold">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small">R&D Team (研发成员)</label>
                            <input type="number" id="rd_count" class="form-control form-control-lg text-primary fw-bold">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small">Laboratories (实验室)</label>
                            <input type="number" id="lab_count" class="form-control form-control-lg text-primary fw-bold">
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-success text-white fw-bold">第二排：全球业务验证数字</div>
                    <div class="card-body row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Validation (百亿小时验证)</label>
                            <div class="input-group">
                                <input type="number" id="val_hours" class="form-control form-control-lg text-success fw-bold">
                                <span class="input-group-text">Billion+ Hours</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Countries (覆盖国家)</label>
                            <input type="number" id="countries" class="form-control form-control-lg text-success fw-bold">
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">第三排：底部实力证明短句</div>
                    <div class="card-body row g-3">
                        <div class="col-md-4">
                            <input type="text" id="text1" class="form-control" placeholder="如: 50+ Industries Empowered">
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="text2" class="form-control" placeholder="如: 2,000+ Global Customers Trust">
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="text3" class="form-control" placeholder="如: ±0.1℃ Precision Engineered">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./common.js"></script>
    <script>
        initLayout('home_config');
        const headers = { 'Authorization': 'Bearer ' + localStorage.getItem('cms_token'), 'Content-Type': 'application/json' };

        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('/api/admin/home-config', { headers });
            const data = await res.json();
            document.getElementById('emp_count').value = data.emp_count;
            document.getElementById('rd_count').value = data.rd_count;
            document.getElementById('lab_count').value = data.lab_count;
            document.getElementById('val_hours').value = data.validation_hours;
            document.getElementById('countries').value = data.countries_count;
            document.getElementById('text1').value = data.bottom_text_1;
            document.getElementById('text2').value = data.bottom_text_2;
            document.getElementById('text3').value = data.bottom_text_3;
        });

        async function saveHomeConfig() {
            const payload = {
                emp_count: document.getElementById('emp_count').value,
                rd_count: document.getElementById('rd_count').value,
                lab_count: document.getElementById('lab_count').value,
                validation_hours: document.getElementById('val_hours').value,
                countries_count: document.getElementById('countries').value,
                bottom_text_1: document.getElementById('text1').value,
                bottom_text_2: document.getElementById('text2').value,
                bottom_text_3: document.getElementById('text3').value,
            };
            const res = await fetch('/api/admin/home-config', { method: 'PUT', headers, body: JSON.stringify(payload) });
            if (res.ok) alert('主页数据更新成功！');
        }
    </script>
</body>
</html>
